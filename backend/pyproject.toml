[project]
name = "watcha-backend"
version = "0.1.0"
description = "Watcha — AI-powered market intelligence agent backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4.0",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
